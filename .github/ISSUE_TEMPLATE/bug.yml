name: Bug report
description: Something in the SDK, the service, the dashboard, the docs or an example does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A small page that shows the problem is the quickest route to a fix.
        **Never paste a secret key (`sk_…`) or a signed ticket.** Your publishable key (`pk_…`) is fine.
  - type: dropdown
    id: area
    attributes:
      label: What is it about?
      options: [SDK (browser), Joining or the service, Dashboard, Documentation, An example, Something else]
    validations: { required: true }
  - type: input
    id: sdk
    attributes:
      label: SDK version
      description: From the CDN URL or your lockfile, for example 0.1.3.
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Browser, version and operating system
      description: And whether it is a phone, and the network if it matters (a corporate network, a VPN).
    validations: { required: true }
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: error
    attributes:
      label: The exact error
      description: The message of the rejected `join()`, or its `code` and `status` with the 1.0 SDK, and the console output around it.
      render: text
  - type: input
    id: when
    attributes:
      label: When (UTC), and the app id if you know it
      description: The activity log in the dashboard shows the join or refusal; its record id helps us find it.
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: A few lines or a link to a minimal page.
  - type: textarea
    id: metrics
    attributes:
      label: What `onMetric` reported (optional)
      description: Events such as `wake`, `rejoined` and `link` show how the connection behaved.
      render: text
  - type: checkboxes
    id: secrets
    attributes:
      label: Before you submit
      options:
        - label: I have not included a secret key (`sk_…`), a signed ticket or personal data.
          required: true
